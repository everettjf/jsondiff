name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - name: Run core tests
        run: swift test
      - name: Build app
        run: |
          xcodebuild \
            -project JSONDiff/JSONDiff.xcodeproj \
            -scheme JSONDiff \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/JSONCompareDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Validate release files
        run: |
          bash -n scripts/build-release.sh scripts/verify-homebrew-release.sh
          ruby -c scripts/update-cask.rb
          ruby -c Casks/jsoncompare.rb
